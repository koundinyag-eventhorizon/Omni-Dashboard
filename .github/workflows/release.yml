name: 'Release Build (Windows & Linux)'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: Linux
          - os: windows-latest
            name: Windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Omni-Dashboard ${{ github.ref_name }}'
          releaseBody: |
            ## Omni-Dashboard Release ${{ github.ref_name }}
            
            Autonomous, local-first productivity ecosystem and intelligent desktop assistant for **Windows** and **Linux**.
            
            ### Downloads
            * **Windows:** Download `.msi` installer or standalone `.exe` setup.
            * **Linux:** Download `.AppImage` (portable) or `.deb` (Debian/Ubuntu/Mint).
            
            ### Quick Requirements
            * Ensure [Ollama](https://ollama.com/) is installed and running (`ollama serve`).
            * Recommended model: `ollama pull llama3.2:3b`.
          releaseDraft: false
          prerelease: false
